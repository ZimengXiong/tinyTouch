name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3@sha256:0143924cb07c717befe27547896f53b74ffe7c3e856fe0d19c0391ec22dc2222
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create ephemeral firmware signing key
        run: |
          source /opt/esp/idf/export.sh
          espsecure.py generate_signing_key --version 2 \
            firmware/tiny_touch_unified/secure_boot_signing_key.pem >/dev/null
      - name: Build factory firmware
        run: |
          source /opt/esp/idf/export.sh
          idf.py -C firmware/tiny_touch_unified build
      - name: Build recovery firmware
        run: |
          source /opt/esp/idf/export.sh
          idf.py -C firmware/tiny_touch_unified -B firmware/tiny_touch_unified/build-recovery -D TINYTOUCH_RECOVERY_BUILD=ON build
      - name: Assemble and verify firmware artifacts
        run: |
          source /opt/esp/idf/export.sh
          for image in \
            firmware/tiny_touch_unified/build/tiny_touch_unified.bin \
            firmware/tiny_touch_unified/build-recovery/tiny_touch_unified.bin; do
            espsecure.py verify_signature --version 2 \
              --keyfile firmware/tiny_touch_unified/secure_boot_signing_key.pem "$image"
          done
          for image in \
            firmware/tiny_touch_unified/build/bootloader/bootloader.bin \
            firmware/tiny_touch_unified/build-recovery/bootloader/bootloader.bin; do
            esptool.py --chip esp32s3 image_info "$image"
          done
          python packaging/assemble-release.py \
            --firmware-build firmware/tiny_touch_unified/build \
            --recovery-build firmware/tiny_touch_unified/build-recovery \
            --build-id "${GITHUB_SHA:0:12}"
          python packaging/release_integrity.py firmware dist/release --commit "$GITHUB_SHA"

  macos-cli:
    strategy:
      matrix:
        include:
          - architecture: arm64
            expected_arch: arm64
            runner: macos-15
          - architecture: x64
            expected_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
      - name: Test CLI and HID protocol
        run: |
          python -m pip install --require-hashes -r software/macos-helper/requirements-bootstrap.txt
          python -m pip install --no-build-isolation --require-hashes \
            -r software/macos-helper/requirements-release.txt
          python -m unittest discover -s tests -v
          python -m py_compile tinytouch software/macos-helper/tinytouch_helper.py packaging/*.py
          zsh -n packaging/build-standalone-macos.sh firmware/build-and-flash firmware/build-recovery
          node --check web/flash/app.js
          node --check web/recovery/app.js
      - name: Build macOS executable
        env:
          TINYTOUCH_SIGNING_IDENTITY: "-"
        run: packaging/build-standalone-macos.sh
      - name: Verify executable
        run: |
          mkdir dist/verify
          tar -C dist/verify -xzf dist/tinytouch.tar.gz
          cli=dist/verify/tinytouch/tinytouch
          test "$("$cli" --version | tail -n 1)" = "tinyTouch CLI $(tr -d '[:space:]' < VERSION)"
          "$cli" _package_test | grep -q "package ok (${{ matrix.expected_arch }})"
          codesign --verify --strict --verbose=2 "$cli"
          file "$cli" | grep -q "${{ matrix.expected_arch }}"
          python - <<'PY'
          import subprocess, time
          command = ["dist/verify/tinytouch/tinytouch", "--version"]
          started = time.monotonic()
          for _ in range(5): subprocess.run(command, check=True, stdout=subprocess.DEVNULL)
          assert time.monotonic() - started < 5, "CLI startup is unexpectedly slow"
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tinytouch-macos-${{ matrix.expected_arch }}
          path: dist/tinytouch.tar.gz

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify release sources
        run: |
          test -s VERSION
          python3 -m py_compile tinytouch packaging/*.py
          node --check web/flash/app.js
          node --check web/recovery/app.js
          ! grep -q "compress:true" web/flash/app.js web/recovery/app.js
