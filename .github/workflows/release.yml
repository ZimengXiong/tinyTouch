name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      release: ${{ steps.release.outputs.release }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python3 release/check-version.py
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            RELEASE_TAG="$INPUT_TAG"
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
            publish=true
          else
            RELEASE_TAG="v$(tr -d '[:space:]' < VERSION)"
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              publish=false
            else
              publish=true
            fi
          fi
          python3 release/check-version.py --tag "$RELEASE_TAG"
          prerelease=false
          [[ "$RELEASE_TAG" == *-dev.* ]] && prerelease=true
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  firmware:
    needs: validate
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release-signing
    container: espressif/idf:release-v5.3@sha256:0143924cb07c717befe27547896f53b74ffe7c3e856fe0d19c0391ec22dc2222
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Load firmware signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.TINYTOUCH_FIRMWARE_SIGNING_KEY_B64 }}
        run: |
          test -n "$SIGNING_KEY_B64"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > \
            firmware/tiny_touch_unified/secure_boot_signing_key.pem
      - name: Build and verify firmware
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          source /opt/esp/idf/export.sh
          idf.py -C firmware/tiny_touch_unified build
          idf.py -C firmware/tiny_touch_unified \
            -B firmware/tiny_touch_unified/build-recovery \
            -D TINYTOUCH_RECOVERY_BUILD=ON build
          for image in \
            firmware/tiny_touch_unified/build/tiny_touch_unified.bin \
            firmware/tiny_touch_unified/build-recovery/tiny_touch_unified.bin; do
            espsecure.py verify_signature --version 2 \
              --keyfile firmware/tiny_touch_unified/secure_boot_signing_key.pem "$image"
          done
          for image in \
            firmware/tiny_touch_unified/build/bootloader/bootloader.bin \
            firmware/tiny_touch_unified/build-recovery/bootloader/bootloader.bin; do
            esptool.py --chip esp32s3 image_info "$image"
          done
          python release/assemble-release.py \
            --firmware-build firmware/tiny_touch_unified/build \
            --recovery-build firmware/tiny_touch_unified/build-recovery \
            --build-id "${RELEASE_COMMIT:0:12}"
          python release/release_integrity.py firmware dist/release \
            --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-firmware
          path: dist/release
          if-no-files-found: error

  cli:
    needs: validate
    if: needs.validate.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - architecture: arm64
            expected_arch: arm64
            runner: macos-15
          - architecture: x64
            expected_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
      - name: Load macOS release signing identity
        env:
          CERTIFICATE_B64: ${{ secrets.TINYTOUCH_MACOS_CERTIFICATE_B64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.TINYTOUCH_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_B64" || { echo 'Missing macOS release signing certificate.' >&2; exit 1; }
          certificate="$RUNNER_TEMP/tinytouch-signing.p12"
          keychain="$RUNNER_TEMP/tinytouch-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          umask 077
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # codesign also needs the private key on the user's Keychain search list.
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          rm -f "$certificate"
          echo "TINYTOUCH_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Test and build CLI
        env:
          TINYTOUCH_REQUIRE_STABLE_IDENTITY: "1"
          TINYTOUCH_SIGNING_TEAM_ID: ${{ vars.TINYTOUCH_MACOS_TEAM_ID }}
        run: |
          python -m pip install --require-hashes -r macos/requirements-bootstrap.txt
          python -m pip install --no-build-isolation --require-hashes \
            -r macos/requirements-release.txt
          python -m unittest discover -s tests -v
          release/build-standalone-macos.sh
          mkdir dist/verify
          tar -C dist/verify -xzf dist/tinytouch.tar.gz
          cli=dist/verify/tinytouch/tinytouch
          test "$("$cli" --version | tail -n 1)" = \
            "tinyTouch CLI $(tr -d '[:space:]' < VERSION)"
          "$cli" _package_test | grep -q "package ok (${{ matrix.expected_arch }})"
          codesign --verify --strict --verbose=2 "$cli"
          file "$cli" | grep -q "${{ matrix.expected_arch }}"
          .venv-release/bin/python release/verify-keychain-upgrade.py "$cli"
      - name: Remove macOS signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tinytouch-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/tinytouch-signing.p12"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-cli-${{ matrix.expected_arch }}
          path: dist/tinytouch.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, firmware, cli]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release-publishing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-firmware
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-cli-arm64
          path: dist/cli-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-cli-x86_64
          path: dist/cli-x86_64
      - name: Assemble release
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python release/attach-cli.py dist/release \
            --arm64 dist/cli-arm64/tinytouch.tar.gz \
            --x86-64 dist/cli-x86_64/tinytouch.tar.gz
          python release/release_integrity.py assembled dist/release \
            --commit "$RELEASE_COMMIT"
          python release/finalize-release.py dist/release \
            --output dist/publish --commit "$RELEASE_COMMIT"
      - name: Attest release assets
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4
        with:
          subject-path: dist/publish/*
      - name: Create release tag
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          tag_sha="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="release $RELEASE_TAG" \
            -f object="$RELEASE_COMMIT" \
            -f type=commit --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_sha"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=(--verify-tag)
          notes_file="release/notes/${RELEASE_TAG#v}.md"
          if [[ -f "$notes_file" ]]; then
            flags+=(--notes-file "$notes_file")
          else
            flags+=(--generate-notes)
          fi
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/publish/* "${flags[@]}"
      - name: Verify published manifest
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          curl -fsSL --retry 6 --retry-delay 5 --max-time 60 \
            "$base/release-manifest.json" -o dist/live-release.json
          python3 release/check-version.py --tag "$RELEASE_TAG" \
            --manifest dist/live-release.json
          test "$(jq -r .build dist/live-release.json)" = "${RELEASE_COMMIT:0:12}"
