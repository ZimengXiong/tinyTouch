name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(prod|beta([.-][0-9A-Za-z.-]+)?)$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "${RELEASE_TAG#v}" = "$(tr -d '[:space:]' < VERSION)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  firmware:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ contains(inputs.tag, '-beta') && 'beta-signing' || 'release-signing' }}
    container: espressif/idf:release-v5.3@sha256:0143924cb07c717befe27547896f53b74ffe7c3e856fe0d19c0391ec22dc2222
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Load firmware signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.TINYTOUCH_FIRMWARE_SIGNING_KEY_B64 }}
        run: |
          test -n "$SIGNING_KEY_B64"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > \
            firmware/tiny_touch_unified/secure_boot_signing_key.pem
      - name: Build and verify firmware
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          source /opt/esp/idf/export.sh
          idf.py -C firmware/tiny_touch_unified build
          espsecure.py verify_signature --version 2 \
            --keyfile firmware/tiny_touch_unified/secure_boot_signing_key.pem \
            firmware/tiny_touch_unified/build/tiny_touch_unified.bin
          esptool.py --chip esp32s3 image_info \
            firmware/tiny_touch_unified/build/bootloader/bootloader.bin
          python release/assemble-release.py \
            --firmware-build firmware/tiny_touch_unified/build \
            --build-id "${RELEASE_COMMIT:0:12}"
          python release/release_integrity.py firmware dist/release \
            --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-firmware
          path: dist/release
          if-no-files-found: error

  cli:
    needs: validate
    strategy:
      matrix:
        include:
          - architecture: arm64
            expected_arch: arm64
            runner: macos-15
          - architecture: x64
            expected_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
      - name: Test and build CLI
        env:
          TINYTOUCH_SIGNING_IDENTITY: "-"
        run: |
          python -m pip install --require-hashes -r macos/requirements-bootstrap.txt
          python -m pip install --no-build-isolation --require-hashes \
            -r macos/requirements-release.txt
          python -m unittest discover -s tests -v
          release/build-standalone-macos.sh
          mkdir dist/verify
          tar -C dist/verify -xzf dist/tinytouch.tar.gz
          cli=dist/verify/tinytouch/tinytouch
          test "$("$cli" --version | tail -n 1)" = \
            "tinyTouch CLI $(tr -d '[:space:]' < VERSION)"
          "$cli" _package_test | grep -q "package ok (${{ matrix.expected_arch }})"
          codesign --verify --strict --verbose=2 "$cli"
          file "$cli" | grep -q "${{ matrix.expected_arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-cli-${{ matrix.expected_arch }}
          path: dist/tinytouch.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, firmware, cli]
    runs-on: ubuntu-latest
    environment: release-publishing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-firmware
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-cli-arm64
          path: dist/cli-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-cli-x86_64
          path: dist/cli-x86_64
      - name: Assemble release
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python release/attach-cli.py dist/release \
            --arm64 dist/cli-arm64/tinytouch.tar.gz \
            --x86-64 dist/cli-x86_64/tinytouch.tar.gz
          python release/release_integrity.py assembled dist/release \
            --commit "$RELEASE_COMMIT"
          python release/finalize-release.py dist/release \
            --output dist/publish --commit "$RELEASE_COMMIT"
      - name: Attest release assets
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4
        with:
          subject-path: dist/publish/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          flags=(--verify-tag --generate-notes)
          [[ "$RELEASE_TAG" == *-prod ]] || flags+=(--prerelease)
          gh release create "$RELEASE_TAG" dist/publish/* "${flags[@]}"
      - name: Verify published manifest
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          curl -fsSL --retry 6 --retry-delay 5 --max-time 60 \
            "$base/release-manifest.json" -o dist/live-release.json
          test "$(jq -r .version dist/live-release.json)" = "${RELEASE_TAG#v}"
          test "$(jq -r .build dist/live-release.json)" = "${RELEASE_COMMIT:0:12}"
