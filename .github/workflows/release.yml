name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-promotion
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  attestations: read

jobs:
  promote:
    # Repository release immutability is a configured server-side prerequisite.
    runs-on: ubuntu-latest
    steps:
      - name: Start promotion timer
        run: echo "PROMOTION_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate tag and wait for exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
          tag_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          event_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$tag_commit" = "$event_commit" || {
            echo "Tag $GITHUB_REF_NAME does not peel to the event commit." >&2
            exit 1
          }
          echo "RELEASE_COMMIT=$tag_commit" >> "$GITHUB_ENV"
          api="repos/$GITHUB_REPOSITORY/actions/workflows/release-candidate.yml/runs"
          wait_started=$SECONDS
          deadline=$((SECONDS + 600))
          run_id=""
          while (( SECONDS < deadline )); do
            runs="$(gh api "$api?branch=main&event=push&per_page=100")"
            run_id="$(jq -r --arg sha "$tag_commit" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")] | first | .id // empty' \
              <<<"$runs")"
            [[ -n "$run_id" ]] && break
            terminal="$(jq -r --arg sha "$tag_commit" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed") | .conclusion] | first // empty' \
              <<<"$runs")"
            if [[ -n "$terminal" && "$terminal" != success ]]; then
              echo "Exact-SHA release candidate ended with: $terminal" >&2
              exit 1
            fi
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "Timed out after 600s waiting for the exact-SHA main-branch candidate." >&2
            exit 1
          fi
          candidate_wait=$((SECONDS - wait_started))
          echo "CANDIDATE_WAIT_SECONDS=$candidate_wait" >> "$GITHUB_ENV"
          artifact_name="release-candidate-${tag_commit}"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          artifact_count="$(jq --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts")"
          test "$artifact_count" = 1
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Download and verify candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/download
          gh run download "${{ steps.candidate.outputs.run_id }}" \
            --name "${{ steps.candidate.outputs.artifact_name }}" \
            --dir dist/download --repo "$GITHUB_REPOSITORY"
          candidate="dist/download/release-candidate-${RELEASE_COMMIT}.tar.gz"
          gh attestation verify "$candidate" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-digest "$RELEASE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          python packaging/release_integrity.py extract "$candidate" dist/candidate
          python packaging/release_integrity.py publish dist/candidate/publish --commit "$RELEASE_COMMIT"
      - name: Create or resume verified release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--verify-tag --generate-notes --draft)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if release_json="$(gh release view "$GITHUB_REF_NAME" \
            --json tagName,isDraft 2>/dev/null)"; then
            test "$(jq -r .tagName <<<"$release_json")" = "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --target "$RELEASE_COMMIT" "${release_flags[@]}"
            release_json="$(gh release view "$GITHUB_REF_NAME" --json tagName,isDraft)"
          fi
          release_state="$(jq -r 'if .isDraft then "draft" else "published" end' <<<"$release_json")"
          gh release view "$GITHUB_REF_NAME" --json assets > dist/release-assets.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("dist/candidate/publish")
          remote = {
              asset["name"]: asset.get("digest")
              for asset in json.loads(Path("dist/release-assets.json").read_text())["assets"]
          }
          expected = {path.name: "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in root.iterdir() if path.is_file()}
          unexpected = sorted(remote.keys() - expected.keys())
          mismatched = sorted(name for name in remote.keys() & expected.keys()
                              if remote[name] != expected[name])
          if unexpected or mismatched:
              raise SystemExit(
                  f"existing release assets cannot be resumed: unexpected={unexpected}, "
                  f"digest_mismatches={mismatched}"
              )
          Path("dist/missing-assets.txt").write_text(
              "".join(f"{name}\n" for name in sorted(expected.keys() - remote.keys()))
          )
          PY
          if [[ "$release_state" = published && -s dist/missing-assets.txt ]]; then
            echo "Published release is missing assets; immutable release cannot be repaired in place." >&2
            exit 1
          fi
          if [[ "$release_state" = draft ]]; then
            while IFS= read -r name; do
              [[ -z "$name" ]] || gh release upload "$GITHUB_REF_NAME" "dist/candidate/publish/$name"
            done < dist/missing-assets.txt
            gh release view "$GITHUB_REF_NAME" --json assets > dist/release-assets.json
            python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("dist/candidate/publish")
          remote = {asset["name"]: asset.get("digest") for asset in
                    json.loads(Path("dist/release-assets.json").read_text())["assets"]}
          expected = {path.name: "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in root.iterdir() if path.is_file()}
          if remote != expected:
              raise SystemExit(f"draft asset verification failed: expected={expected}, remote={remote}")
          PY
            gh release edit "$GITHUB_REF_NAME" --draft=false
            release_state=published
          fi
          echo "release_state=$release_state" >> "$GITHUB_OUTPUT"
      - name: Dispatch flasher-only site deployment
        env:
          GH_TOKEN: ${{ secrets.TINYTOUCH_SITE_DISPATCH_TOKEN }}
        run: |
          test -n "${GH_TOKEN:-}"
          web_sha="$(awk '$2 == "tinytouch-web-flashers.tar.gz" {print $1}' \
            dist/candidate/publish/checksums.txt)"
          test -n "$web_sha"
          # The receiver must verify web_sha256 before extraction and deduplicate
          # repository_dispatch events by this deterministic idempotency key.
          dispatch_key="${GITHUB_REF_NAME}:${web_sha}"
          gh api repos/ZimengXiong/alpacaengineer/dispatches \
            --method POST \
            -f event_type=tinytouch-release \
            -f "client_payload[tag]=$GITHUB_REF_NAME" \
            -f "client_payload[release_commit]=$RELEASE_COMMIT" \
            -f "client_payload[web_sha256]=$web_sha" \
            -f "client_payload[idempotency_key]=$dispatch_key"
      - name: Verify production flasher and CLI
        run: |
          base=https://alpacaengineer.ing/tinytouch/batch-0
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            if curl -fsS --max-time 15 \
              "$base/release.json?release=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SECONDS" \
              -o dist/live-release.json && \
              test "$(jq -r .version dist/live-release.json)" = "${GITHUB_REF_NAME#v}" && \
              test "$(jq -r .build dist/live-release.json)" = "${RELEASE_COMMIT:0:12}"; then
              break
            fi
            sleep 5
          done
          test -s dist/live-release.json
          test "$(jq -r .version dist/live-release.json)" = "${GITHUB_REF_NAME#v}"
          test "$(jq -r .build dist/live-release.json)" = "${RELEASE_COMMIT:0:12}"
          for area in flash recovery; do
            curl -fsS --max-time 15 \
              "$base/$area/manifest.json?release=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              -o "dist/live-$area.json"
            test "$(jq -r .version "dist/live-$area.json")" = "${GITHUB_REF_NAME#v}"
          done
          for platform in macos-arm64 macos-x86_64; do
            file="$(jq -r --arg platform "$platform" '.cli[$platform].file' dist/live-release.json)"
            size="$(jq -r --arg platform "$platform" '.cli[$platform].size' dist/live-release.json)"
            sha256="$(jq -r --arg platform "$platform" '.cli[$platform].sha256' dist/live-release.json)"
            curl -fsS --max-time 60 "$base/cli/$file" -o "dist/$file"
            test "$(stat -c %s "dist/$file")" = "$size"
            echo "$sha256  dist/$file" | sha256sum --check --strict
          done
      - name: Activate verified CLI update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel_api="repos/$GITHUB_REPOSITORY/contents/channels/batch-0.json"
          current="$(gh api "$channel_api?ref=main")"
          channel_sha="$(jq -r .sha <<<"$current")"
          jq -r .content <<<"$current" | base64 --decode > dist/current-channel.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          current = json.loads(Path("dist/current-channel.json").read_text())
          value = current.get("manifest")
          pattern = r"https://github\.com/ZimengXiong/TinyTouch/releases/download/v[^/]+/release-manifest\.json"
          if not isinstance(value, str) or re.fullmatch(pattern, value) is None:
              raise SystemExit("current update channel is malformed; refusing to replace it")
          desired = {
              "manifest": (
                  "https://github.com/ZimengXiong/TinyTouch/releases/download/"
                  f"{os.environ['GITHUB_REF_NAME']}/release-manifest.json"
              )
          }
          Path("dist/next-channel.json").write_text(json.dumps(desired, indent=2) + "\n")
          PY
          if cmp -s dist/current-channel.json dist/next-channel.json; then
            echo "Update channel already points to $GITHUB_REF_NAME."
          else
            content="$(base64 < dist/next-channel.json | tr -d '\n')"
            gh api "$channel_api" --method PUT \
              -f message="Activate tinyTouch ${GITHUB_REF_NAME#v}" \
              -f content="$content" \
              -f sha="$channel_sha" \
              -f branch=main >/dev/null
          fi
          active="$(gh api "$channel_api?ref=main")"
          jq -r .content <<<"$active" | base64 --decode > dist/active-channel.json
          cmp dist/next-channel.json dist/active-channel.json
      - name: Record promotion benchmark
        if: always()
        run: |
          elapsed="$(($(date +%s) - PROMOTION_STARTED))"
          {
            echo "### Release promotion timing"
            echo
            echo "Promotion runner time: ${elapsed}s"
            echo "Candidate wait time: ${CANDIDATE_WAIT_SECONDS:-not reached}s"
            echo "Baseline: seven rebuild releases had a 233s median; their publish-only jobs had an 11s median."
          } >> "$GITHUB_STEP_SUMMARY"
