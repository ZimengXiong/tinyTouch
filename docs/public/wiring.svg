<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">tinyTouch fingerprint sensor wiring</title>
  <desc id="desc">Six connections between a supported ESP32-S3 board and a ZW101-style fingerprint sensor. Sensor TX connects to ESP GPIO44 RX. Sensor RX connects to ESP GPIO43 TX. TouchOut connects to GPIO2. Sensor pins 1 and 3 connect to 3.3 volts. Pin 6 connects to ground.</desc>
  <style>
    .bg{fill:#fafafa}.panel{fill:#fff;stroke:#d4d4d8;stroke-width:2}.title{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18181b}.sub{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#71717a}.pin{font:600 14px "SFMono-Regular",Consolas,monospace;fill:#27272a}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52525b}.wire{fill:none;stroke-width:3;stroke-linecap:round}.power{stroke:#c2413b}.signal{stroke:#335bd6}.ground{stroke:#52525b}.node{stroke:#fff;stroke-width:2}
    @media(prefers-color-scheme:dark){.bg{fill:#171719}.panel{fill:#111113;stroke:#3f3f46}.title{fill:#f4f4f5}.sub{fill:#a1a1aa}.pin{fill:#e4e4e7}.small{fill:#a1a1aa}.node{stroke:#111113}}
  </style>
  <rect class="bg" width="980" height="560" rx="18"/>
  <rect class="panel" x="55" y="55" width="340" height="450" rx="14"/>
  <text class="title" x="85" y="96">ESP32-S3 board</text>
  <text class="sub" x="85" y="121">Super Mini or Seeed Studio XIAO ESP32-S3</text>

  <text class="pin" x="92" y="178">3V3</text><circle class="node" cx="350" cy="173" r="6" fill="#c2413b"/>
  <text class="pin" x="92" y="238">GPIO2</text><text class="small" x="170" y="238">XIAO D1</text><circle class="node" cx="350" cy="233" r="6" fill="#335bd6"/>
  <text class="pin" x="92" y="298">GPIO44</text><text class="small" x="170" y="298">XIAO D7, RX</text><circle class="node" cx="350" cy="293" r="6" fill="#335bd6"/>
  <text class="pin" x="92" y="358">GPIO43</text><text class="small" x="170" y="358">XIAO D6, TX</text><circle class="node" cx="350" cy="353" r="6" fill="#335bd6"/>
  <text class="pin" x="92" y="418">GND</text><circle class="node" cx="350" cy="413" r="6" fill="#52525b"/>

  <rect class="panel" x="585" y="55" width="340" height="450" rx="14"/>
  <text class="title" x="615" y="96">Fingerprint sensor</text>
  <text class="sub" x="615" y="121">ZW101-style 1.0 mm, 6-pin connector</text>

  <circle class="node" cx="630" cy="158" r="6" fill="#c2413b"/><text class="pin" x="660" y="163">1  VTouch, 3.3 V</text>
  <circle class="node" cx="630" cy="218" r="6" fill="#335bd6"/><text class="pin" x="660" y="223">2  TouchOut</text>
  <circle class="node" cx="630" cy="278" r="6" fill="#c2413b"/><text class="pin" x="660" y="283">3  VCC, 3.3 V</text>
  <circle class="node" cx="630" cy="338" r="6" fill="#335bd6"/><text class="pin" x="660" y="343">4  TX</text>
  <circle class="node" cx="630" cy="398" r="6" fill="#335bd6"/><text class="pin" x="660" y="403">5  RX</text>
  <circle class="node" cx="630" cy="458" r="6" fill="#52525b"/><text class="pin" x="660" y="463">6  GND</text>

  <path class="wire power" d="M350 173H460V158H630"/>
  <path class="wire power" d="M460 173V278H630"/>
  <path class="wire signal" d="M350 233H500V218H630"/>
  <path class="wire signal" d="M350 293H530V338H630"/>
  <path class="wire signal" d="M350 353H550V398H630"/>
  <path class="wire ground" d="M350 413H500V458H630"/>

  <text class="small" x="55" y="540">UART crosses direction: sensor TX goes to ESP RX, and sensor RX goes to ESP TX.</text>
</svg>
